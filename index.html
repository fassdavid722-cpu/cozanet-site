      PRE-RENDER FALLBACK (2026-08-30):
      This app is a client-side-rendered SPA — a plain HTTP fetch (crawlers,
      grant reviewers, curl) previously saw an empty shell because content
      only appeared after JS executed. The static block below inside #root
      is a real content snapshot of the homepage, visible immediately to any
      fetch. React still mounts normally via createRoot().render() for real
      browsers and replaces this block on load — no behavior change for
      visitors with JavaScript enabled.
    -->

          <span class="pill">Software, AI &amp; Financial Infrastructure</span>
          <h1>Cozanet — Intelligent infrastructure for the digital economy</h1>
          <p>Cozanet builds the products, platforms, and protocols that power intelligent software, financial infrastructure, and automation across the global digital economy. Our products span AI, automation, and developer tools — starting with AEGIS, our financial operating system moving money across Africa's crypto, bank, and mobile money rails.</p>

          <h2>Products</h2>
          <ul>
            <li><strong>AEGIS</strong> — Programmable financial infrastructure for moving money across Africa. A smart-routing and settlement layer for digital assets, payments, and financial applications. Currently in Phase One (wallet infrastructure live today), with a multi-rail Smart Router (banking, mobile money, blockchain rails including BNB Smart Chain, Stellar, and Circle Arc/USDC) in active development.</li>
            <li><strong>Cozanet AI</strong> — Intelligent products powered by artificial intelligence, designed to augment human capability.</li>
            <li><strong>Automation</strong> — A workflow engine to build, deploy, and manage automated workflows that connect systems and eliminate repetitive tasks.</li>
            <li><strong>Developer Platform</strong> — Premium APIs, SDKs, and developer tools built on a gateway-first, microservices architecture.</li>
            <li><strong>Enterprise</strong> — Scalable infrastructure and compliance-ready solutions for organizations operating at global scale.</li>
            <li><strong>CZN</strong> — Cozanet's ecosystem token, used for rewards and incentives across the platform.</li>
          </ul>

          <h2>Technology &amp; Security</h2>
          <p>Every request flows through a unified gateway handling authentication, rate limiting, and routing to independent service engines. Each functional domain runs as an isolated engine with its own data, logic, and scaling policy — no monolithic bottlenecks. Security is treated as the foundation, not a feature: end-to-end AES-256-GCM encryption, zero-trust identity verification, HSM-backed key management, and immutable audit trails across every system.</p>

          <h2>Company</h2>
          <p>Cozanet — technology that works for everyone. Learn more via <a href="https://aegis.cozanet.net">AEGIS</a>, our documentation, or get in touch through the contact page.</p>
        </div>
