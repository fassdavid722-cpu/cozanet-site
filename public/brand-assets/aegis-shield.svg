<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="AEGIS logo">
  <defs>
    <linearGradient id="aegis-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="aegis-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#E0A020"/>
    </linearGradient>
  </defs>
  
  <!-- Shield outline -->
  <path d="M128 16 L220 48 L220 136 C220 180 180 216 128 240 C76 216 36 180 36 136 L36 48 Z"
        fill="url(#aegis-purple)" stroke="url(#aegis-gold)" stroke-width="3"/>
  
  <!-- Inner shield highlight -->
  <path d="M128 36 L200 60 L200 130 C200 166 168 196 128 216 C88 196 56 166 56 130 L56 60 Z"
        fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>
  
  <!-- "A" monogram -->
  <path d="M128 80 L100 160 M128 80 L156 160 M112 136 L144 136"
        stroke="url(#aegis-gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Bottom dot -->
  <circle cx="128" cy="180" r="5" fill="url(#aegis-gold)"/>
</svg>
